<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeckBuilder Demo - MTG Commander</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link href="//cdn.jsdelivr.net/npm/mana-font@latest/css/mana.min.css" rel="stylesheet" type="text/css">
</head>
<body>
  <div class="app">
    <!-- Top Bar -->
    <header class="topbar">
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 32 32" fill="currentColor">
          <!-- Shield-like MTG icon paths -->
          <path d="M16 2L4 8v8c0 7.5 5.1 14.5 12 16 6.9-1.5 12-8.5 12-16V8L16 2zm0 4l8 4v6c0 5.5-3.4 10.5-8 12-4.6-1.5-8-6.5-8-12v-6l8-4z"/>
          <path d="M16 10l-4 2v4c0 2.8 1.7 5.3 4 6 2.3-.7 4-3.2 4-6v-4l-4-2z"/>
        </svg>
        <span>DeckBuilder</span>
      </div>
      <div class="deck-selector" id="deck-selector">
        <button class="deck-selector-button" id="deck-selector-button">
          <span class="deck-selector-placeholder">Select a deck...</span>
        </button>
        <div class="deck-selector-dropdown hidden" id="deck-selector-dropdown">
          <!-- Populated by JS -->
        </div>
      </div>

      <div class="search-container">
        <div class="search-input-wrapper">
          <input type="text" class="input search-input" id="search-input" placeholder="Search for cards..." autocomplete="off">
          <div class="search-filters" id="search-filters">
            <button class="search-filter-toggle" id="search-filter-toggle" title="Filter by deck colors">
              <svg class="search-filter-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M3 4h18v2H3V4zm0 7h12v2H3v-2zm0 7h18v2H3v-2z"/>
              </svg>
            </button>
            <div class="search-filter-colors" id="search-filter-colors"></div>
          </div>
        </div>
        <div class="dropdown hidden" id="search-dropdown"></div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-primary btn-sm" id="export-btn">Export</button>
        <a href="https://www.linkedin.com/in/denyshoncharenko/" target="_blank" rel="noopener" class="social-link" title="LinkedIn">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
          </svg>
        </a>
        <a href="https://github.com/devmugi/mtg-deckbuilder-web" target="_blank" rel="noopener" class="social-link" title="GitHub">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/>
          </svg>
        </a>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Left Panel -->
      <aside class="left-panel">
        <div class="card-preview" id="card-preview">
          <div class="card-preview-placeholder">Hover over a card to preview</div>
        </div>
        <div class="stats-panel" id="stats-panel">
          <div class="stats-section">
            <h3 class="stats-title">Mana Curve</h3>
            <div class="mana-curve" id="mana-curve"></div>
          </div>
          <div class="stats-section">
            <h3 class="stats-title">Colors</h3>
            <div class="color-pie" id="color-pie"></div>
          </div>
        </div>
      </aside>

      <!-- Main Panel -->
      <section class="main-panel">
        <span class="loading-indicator hidden" id="loading-indicator">
          Loading... <span id="loading-progress">0/100</span>
        </span>

        <button class="filter-toggle" id="filter-toggle" aria-label="Toggle filters">
          <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
            <path d="M3 4h18v2H3V4zm3 7h12v2H6v-2zm3 7h6v2H9v-2z"/>
          </svg>
        </button>
        <div class="filter-bar" id="filter-bar">
          <div class="filter-group">
            <span class="filter-label">Colors</span>
            <div class="color-filters" id="color-filters">
            <button class="color-filter" data-color="W" title="White">
              <img src="https://svgs.scryfall.io/card-symbols/W.svg" alt="White">
            </button>
            <button class="color-filter" data-color="U" title="Blue">
              <img src="https://svgs.scryfall.io/card-symbols/U.svg" alt="Blue">
            </button>
            <button class="color-filter" data-color="B" title="Black">
              <img src="https://svgs.scryfall.io/card-symbols/B.svg" alt="Black">
            </button>
            <button class="color-filter" data-color="R" title="Red">
              <img src="https://svgs.scryfall.io/card-symbols/R.svg" alt="Red">
            </button>
            <button class="color-filter" data-color="G" title="Green">
              <img src="https://svgs.scryfall.io/card-symbols/G.svg" alt="Green">
            </button>
            <button class="color-filter" data-color="C" title="Colorless">
              <img src="https://svgs.scryfall.io/card-symbols/C.svg" alt="Colorless">
            </button>
            </div>
          </div>
          <div class="filter-divider"></div>
          <div class="filter-group">
            <span class="filter-label">Types</span>
            <div class="type-filters" id="type-filters">
              <button class="type-filter-btn" data-type="Planeswalker" title="Planeswalkers">
              <i class="ms ms-planeswalker"></i>
              <span class="type-count" id="type-count-Planeswalker">0</span>
            </button>
            <button class="type-filter-btn" data-type="Creature" title="Creatures">
              <i class="ms ms-creature"></i>
              <span class="type-count" id="type-count-Creature">0</span>
            </button>
            <button class="type-filter-btn" data-type="Artifact" title="Artifacts">
              <i class="ms ms-artifact"></i>
              <span class="type-count" id="type-count-Artifact">0</span>
            </button>
            <button class="type-filter-btn" data-type="Instant" title="Instants">
              <i class="ms ms-instant"></i>
              <span class="type-count" id="type-count-Instant">0</span>
            </button>
            <button class="type-filter-btn" data-type="Enchantment" title="Enchantments">
              <i class="ms ms-enchantment"></i>
              <span class="type-count" id="type-count-Enchantment">0</span>
            </button>
            <button class="type-filter-btn" data-type="Sorcery" title="Sorceries">
              <i class="ms ms-sorcery"></i>
              <span class="type-count" id="type-count-Sorcery">0</span>
            </button>
              <button class="type-filter-btn" data-type="Land" title="Lands">
                <i class="ms ms-land"></i>
                <span class="type-count" id="type-count-Land">0</span>
              </button>
            </div>
          </div>
          <div class="filter-divider"></div>
          <div class="filter-group">
            <span class="filter-label">Boards</span>
            <div class="board-filters" id="board-filters">
              <button class="board-filter-btn" data-board="sideboard" title="Show Sideboard">
                <span>SB</span>
                <span class="board-count" id="board-count-sideboard">0</span>
              </button>
              <button class="board-filter-btn" data-board="maybeboard" title="Show Maybeboard">
                <span>MB</span>
                <span class="board-count" id="board-count-maybeboard">0</span>
              </button>
            </div>
          </div>
        </div>

        <div class="deck-list" id="deck-list">
          <div class="deck-empty" id="deck-empty">
            <svg class="deck-empty-icon" viewBox="0 0 64 64" fill="currentColor">
              <rect x="8" y="8" width="48" height="48" rx="4" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 4"/>
              <path d="M32 24v16M24 32h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <p>No cards in deck</p>
            <p style="font-size: var(--font-size-sm);">Search and add cards to get started</p>
          </div>
        </div>
      </section>
    </main>

    <!-- Bottom Bar -->
    <footer class="bottombar">
      <div class="stat">
        <span class="stat-label">Cards:</span>
        <span class="stat-value" id="stat-cards">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">SB:</span>
        <span class="stat-value" id="zone-count-sideboard">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">MB:</span>
        <span class="stat-value" id="zone-count-maybeboard">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Total:</span>
        <span class="stat-value stat-value-accent" id="stat-price">$0.00</span>
      </div>
    </footer>

    <!-- Mobile Bottom Tabs -->
    <nav class="mobile-tabs" id="mobile-tabs">
      <button class="mobile-tab active" data-tab="deck" aria-label="Deck tab">
        <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24" aria-hidden="true">
          <path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/>
        </svg>
        <span>Deck</span>
      </button>
      <button class="mobile-tab" data-tab="search" aria-label="Search tab">
        <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24" aria-hidden="true">
          <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <span>Search</span>
      </button>
      <button class="mobile-tab" data-tab="stats" aria-label="Stats tab">
        <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24" aria-hidden="true">
          <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/>
        </svg>
        <span>Stats</span>
      </button>
    </nav>

    <!-- Card Preview Modal -->
    <div class="card-modal-backdrop hidden" id="card-modal-backdrop"></div>
    <div class="card-modal hidden" id="card-modal" role="dialog" aria-modal="true" aria-label="Card preview">
      <div class="card-modal-handle"></div>
      <div class="card-modal-image" id="card-modal-image"></div>
      <div class="card-modal-info">
        <div class="card-modal-name" id="card-modal-name"></div>
        <div class="card-modal-type" id="card-modal-type"></div>
        <div class="card-modal-price" id="card-modal-price"></div>
      </div>
      <div class="card-modal-actions" id="card-modal-actions"></div>
    </div>

    <!-- Card Action Menu (mobile) -->
    <div class="card-action-menu hidden" id="card-action-menu">
      <div class="card-action-menu-qty">
        <button class="btn btn-secondary btn-sm" data-menu-action="minus">−</button>
        <span class="card-action-menu-qty-value" id="card-action-menu-qty">1</span>
        <button class="btn btn-secondary btn-sm" data-menu-action="plus">+</button>
      </div>
      <button class="card-action-menu-item" data-menu-action="sideboard">Move to Sideboard</button>
      <button class="card-action-menu-item" data-menu-action="maybeboard">Move to Maybeboard</button>
      <button class="card-action-menu-item" data-menu-action="main">Move to Main</button>
      <button class="card-action-menu-item danger" data-menu-action="delete">Remove from Deck</button>
    </div>
  </div>

  <div class="modal hidden" id="import-modal">
    <div class="modal-content">
      <h2 class="modal-title">Import Deck</h2>
      <input type="text" class="input" id="import-deck-name"
             placeholder="Deck name (optional)" style="margin-bottom: var(--space-sm);">
      <textarea class="modal-textarea" id="import-textarea"
                placeholder="1 Sol Ring
1 Command Tower
1 Arcane Signet

// Sideboard
1 Swords to Plowshares

// Maybeboard
1 Phyrexian Arena"></textarea>
      <div class="modal-actions">
        <button class="btn btn-secondary btn-sm" id="import-cancel">Cancel</button>
        <button class="btn btn-primary btn-sm" id="import-confirm">Import</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
