<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeckBuilder Demo - MTG Commander</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link href="//cdn.jsdelivr.net/npm/mana-font@latest/css/mana.min.css" rel="stylesheet" type="text/css">
</head>
<body>
  <div class="app">
    <!-- Top Bar -->
    <header class="topbar">
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 32 32" fill="currentColor">
          <!-- Shield-like MTG icon paths -->
          <path d="M16 2L4 8v8c0 7.5 5.1 14.5 12 16 6.9-1.5 12-8.5 12-16V8L16 2zm0 4l8 4v6c0 5.5-3.4 10.5-8 12-4.6-1.5-8-6.5-8-12v-6l8-4z"/>
          <path d="M16 10l-4 2v4c0 2.8 1.7 5.3 4 6 2.3-.7 4-3.2 4-6v-4l-4-2z"/>
        </svg>
        <span>DeckBuilder</span>
      </div>
      <div class="deck-selector" id="deck-selector">
        <button class="deck-selector-button" id="deck-selector-button">
          <span class="deck-selector-placeholder">Select a deck...</span>
        </button>
        <div class="deck-selector-dropdown hidden" id="deck-selector-dropdown">
          <!-- Populated by JS -->
        </div>
      </div>

      <div class="search-container">
        <input type="text" class="input" id="search-input" placeholder="Search for cards..." autocomplete="off">
        <div class="dropdown hidden" id="search-dropdown"></div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-primary btn-sm" id="import-btn">Import</button>
        <button class="btn btn-primary btn-sm" id="export-btn">Export</button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Left Panel -->
      <aside class="left-panel">
        <div class="card-preview" id="card-preview">
          <div class="card-preview-placeholder">Hover over a card to preview</div>
        </div>
        <div class="stats-panel" id="stats-panel">
          <div class="stats-section">
            <h3 class="stats-title">Mana Curve</h3>
            <div class="mana-curve" id="mana-curve"></div>
          </div>
          <div class="stats-section">
            <h3 class="stats-title">Colors</h3>
            <div class="color-pie" id="color-pie"></div>
            <div class="color-legend" id="color-legend"></div>
          </div>
        </div>
      </aside>

      <!-- Main Panel -->
      <section class="main-panel">
        <span class="loading-indicator hidden" id="loading-indicator">
          Loading... <span id="loading-progress">0/100</span>
        </span>

        <div class="filter-bar" id="filter-bar">
          <div class="filter-group">
            <span class="filter-label">Colors</span>
            <div class="color-filters" id="color-filters">
            <button class="color-filter" data-color="W" title="White">
              <img src="https://svgs.scryfall.io/card-symbols/W.svg" alt="White">
            </button>
            <button class="color-filter" data-color="U" title="Blue">
              <img src="https://svgs.scryfall.io/card-symbols/U.svg" alt="Blue">
            </button>
            <button class="color-filter" data-color="B" title="Black">
              <img src="https://svgs.scryfall.io/card-symbols/B.svg" alt="Black">
            </button>
            <button class="color-filter" data-color="R" title="Red">
              <img src="https://svgs.scryfall.io/card-symbols/R.svg" alt="Red">
            </button>
            <button class="color-filter" data-color="G" title="Green">
              <img src="https://svgs.scryfall.io/card-symbols/G.svg" alt="Green">
            </button>
            <button class="color-filter" data-color="C" title="Colorless">
              <img src="https://svgs.scryfall.io/card-symbols/C.svg" alt="Colorless">
            </button>
            </div>
          </div>
          <div class="filter-divider"></div>
          <div class="filter-group">
            <span class="filter-label">Boards</span>
            <div class="board-filters" id="board-filters">
              <button class="board-filter-btn" data-board="sideboard" title="Show Sideboard">
                <span>SB</span>
                <span class="board-count" id="board-count-sideboard">0</span>
              </button>
              <button class="board-filter-btn" data-board="maybeboard" title="Show Maybeboard">
                <span>MB</span>
                <span class="board-count" id="board-count-maybeboard">0</span>
              </button>
            </div>
          </div>
          <div class="filter-divider"></div>
          <div class="filter-group">
            <span class="filter-label">Types</span>
            <div class="type-filters" id="type-filters">
              <button class="type-filter-btn" data-type="Planeswalker" title="Planeswalkers">
              <i class="ms ms-planeswalker"></i>
              <span class="type-count" id="type-count-Planeswalker">0</span>
            </button>
            <button class="type-filter-btn" data-type="Creature" title="Creatures">
              <i class="ms ms-creature"></i>
              <span class="type-count" id="type-count-Creature">0</span>
            </button>
            <button class="type-filter-btn" data-type="Artifact" title="Artifacts">
              <i class="ms ms-artifact"></i>
              <span class="type-count" id="type-count-Artifact">0</span>
            </button>
            <button class="type-filter-btn" data-type="Instant" title="Instants">
              <i class="ms ms-instant"></i>
              <span class="type-count" id="type-count-Instant">0</span>
            </button>
            <button class="type-filter-btn" data-type="Enchantment" title="Enchantments">
              <i class="ms ms-enchantment"></i>
              <span class="type-count" id="type-count-Enchantment">0</span>
            </button>
            <button class="type-filter-btn" data-type="Sorcery" title="Sorceries">
              <i class="ms ms-sorcery"></i>
              <span class="type-count" id="type-count-Sorcery">0</span>
            </button>
              <button class="type-filter-btn" data-type="Land" title="Lands">
                <i class="ms ms-land"></i>
                <span class="type-count" id="type-count-Land">0</span>
              </button>
            </div>
          </div>
        </div>

        <div class="deck-list" id="deck-list">
          <div class="deck-empty" id="deck-empty">
            <svg class="deck-empty-icon" viewBox="0 0 64 64" fill="currentColor">
              <rect x="8" y="8" width="48" height="48" rx="4" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 4"/>
              <path d="M32 24v16M24 32h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <p>No cards in deck</p>
            <p style="font-size: var(--font-size-sm);">Search and add cards to get started</p>
          </div>
        </div>
      </section>
    </main>

    <!-- Bottom Bar -->
    <footer class="bottombar">
      <div class="stat">
        <span class="stat-label">Cards:</span>
        <span class="stat-value" id="stat-cards">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">SB:</span>
        <span class="stat-value" id="zone-count-sideboard">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">MB:</span>
        <span class="stat-value" id="zone-count-maybeboard">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Total:</span>
        <span class="stat-value stat-value-accent" id="stat-price">$0.00</span>
      </div>
    </footer>
  </div>

  <div class="modal hidden" id="import-modal">
    <div class="modal-content">
      <h2 class="modal-title">Import Deck</h2>
      <textarea class="modal-textarea" id="import-textarea"
                placeholder="1 Sol Ring
1 Command Tower
1 Arcane Signet

// Sideboard
1 Swords to Plowshares

// Maybeboard
1 Phyrexian Arena"></textarea>
      <div class="modal-actions">
        <button class="btn btn-secondary btn-sm" id="import-cancel">Cancel</button>
        <button class="btn btn-primary btn-sm" id="import-confirm">Import</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
